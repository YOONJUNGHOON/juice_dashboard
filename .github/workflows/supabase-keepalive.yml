name: Supabase keep-alive

# Free-tier Supabase projects pause after 1 week of inactivity.
# Runs Mon/Thu 03:00 UTC (12:00 KST) so the longest gap is 4 days.
on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Supabase client
        run: npm install --no-save @supabase/supabase-js

      - name: Ping database
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KEEPALIVE_SOURCE: github-actions
        run: node scripts/keep-alive.mjs
