name: Supabase keep-alive

# Free-tier Supabase projects pause after 1 week of inactivity.
# Runs Mon/Thu 03:00 UTC (12:00 KST) so the longest gap is 4 days.
on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Supabase client
        run: npm install --no-save @supabase/supabase-js

      - name: Ping database
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          KEEPALIVE_SOURCE: github-actions
        run: node scripts/keep-alive.mjs

  # GitHub disables scheduled workflows after 60 days of repo inactivity.
  # This re-enables it via the Actions API once the last commit is 45 days
  # old — no dummy commits, so the repo history stays clean.
  # Separate job to keep the actions:write permission off the ping job.
  #
  # continue-on-error: this job is best-effort insurance, while `ping` is the
  # job that actually keeps the database awake. Without it a failure here
  # turns the whole run red and hides whether the ping itself succeeded.
  # It needs the repo's workflow permissions set to read/write — otherwise it
  # is refused at "Set up job" and shows as a warning on an otherwise green run.
  keepalive:
    needs: ping
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v5
      - uses: gautamkrishnar/keepalive-workflow@v2
        with:
          use_api: true
